<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0d14"/>
      <stop offset="100%" stop-color="#12101f"/>
    </linearGradient>
    <linearGradient id="mirrorGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="mirrorGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <marker id="arrowGreen" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#22c55e"/>
    </marker>
    <marker id="arrowRed" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#ef4444"/>
    </marker>
    <marker id="arrowOrange" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#f59e0b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#f1f5f9">MirrorDrift</text>
  <text x="400" y="58" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#64748b">Actuated Mirror-Based Attacks on LiDAR SLAM · IROS 2026</text>
  <line x1="40" y1="68" x2="760" y2="68" stroke="#1e293b" stroke-width="1"/>

  <!-- Ground / road -->
  <rect x="40" y="310" width="480" height="50" fill="url(#groundGrad)" stroke="#1e293b" stroke-width="0.5"/>
  <line x1="40" y1="335" x2="520" y2="335" stroke="#fbbf24" stroke-width="1" stroke-dasharray="12,8" opacity="0.35"/>

  <!-- === Target vehicle with LiDAR === -->
  <!-- Car body -->
  <rect x="55" y="274" width="90" height="40" rx="5" fill="#334155" stroke="#475569" stroke-width="1.2"/>
  <rect x="68" y="260" width="65" height="22" rx="4" fill="#475569" stroke="#64748b" stroke-width="0.8"/>
  <!-- Wheels -->
  <circle cx="75"  cy="314" r="9" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <circle cx="135" cy="314" r="9" fill="#0f172a" stroke="#334155" stroke-width="2"/>
  <!-- LiDAR sensor on roof -->
  <ellipse cx="100" cy="258" rx="10" ry="6" fill="#0ea5e9" opacity="0.9"/>
  <circle  cx="100" cy="255" r="4" fill="#38bdf8"/>
  <text x="100" y="340" text-anchor="middle" font-family="monospace" font-size="8" fill="#94a3b8">LiDAR vehicle</text>

  <!-- === Wall / building (real obstacle) === -->
  <rect x="420" y="170" width="20" height="145" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="430" y="165" text-anchor="middle" font-family="monospace" font-size="9" fill="#475569">wall</text>
  <!-- Real surface points -->
  <g fill="#22c55e" filter="url(#glow)" opacity="0.8">
    <circle cx="420" cy="190" r="2.5"/>
    <circle cx="420" cy="210" r="2.5"/>
    <circle cx="420" cy="230" r="2.5"/>
    <circle cx="420" cy="250" r="2.5"/>
    <circle cx="420" cy="270" r="2.5"/>
    <circle cx="420" cy="290" r="2.5"/>
  </g>

  <!-- === Actuated Mirror === -->
  <!-- Mirror stand -->
  <line x1="290" y1="310" x2="290" y2="270" stroke="#64748b" stroke-width="3"/>
  <rect x="282" y="308" width="16" height="6" rx="2" fill="#475569"/>
  <!-- Actuation arc hint -->
  <path d="M 265 262 A 28 28 0 0 1 315 262" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="3,3" opacity="0.6"/>
  <text x="290" y="252" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#64748b">actuator</text>
  <!-- Mirror surface (tilted ~30 degrees) -->
  <line x1="262" y1="290" x2="318" y2="248" stroke="url(#mirrorGrad)" stroke-width="6" stroke-linecap="round" filter="url(#mirrorGlow)" opacity="0.9"/>
  <!-- Mirror shine -->
  <line x1="268" y1="284" x2="308" y2="256" stroke="white" stroke-width="1.5" opacity="0.4" stroke-linecap="round"/>
  <text x="335" y="244" font-family="monospace" font-size="9" fill="#cbd5e1">mirror</text>

  <!-- === Laser beams === -->

  <!-- 1. Legitimate beam: LiDAR → real wall (dashed green, blocked by mirror) -->
  <line x1="100" y1="255" x2="280" y2="267" stroke="#22c55e" stroke-width="1.2" stroke-dasharray="6,4" opacity="0.4" marker-end="url(#arrowGreen)"/>

  <!-- 2. Incident beam: LiDAR → Mirror (solid cyan) -->
  <line x1="100" y1="255" x2="272" y2="278" stroke="#38bdf8" stroke-width="1.8" opacity="0.9" marker-end="url(#arrowOrange)"/>

  <!-- 3. Reflected beam: Mirror → Ghost location (solid red) -->
  <line x1="278" y1="271" x2="440" y2="165" stroke="#ef4444" stroke-width="1.8" opacity="0.9" marker-end="url(#arrowRed)"/>

  <!-- Incidence angle indicator -->
  <path d="M 262 275 A 18 18 0 0 1 271 260" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.7"/>
  <path d="M 271 260 A 18 18 0 0 1 285 268" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.7"/>
  <text x="243" y="262" font-family="monospace" font-size="7" fill="#f59e0b">θ</text>
  <text x="276" y="253" font-family="monospace" font-size="7" fill="#f59e0b">θ</text>

  <!-- === Ghost points cluster (where mirror reflection appears) === -->
  <g fill="#ef4444" filter="url(#glow)" opacity="0.9">
    <circle cx="440" cy="165" r="5"/>
    <circle cx="452" cy="178" r="4"/>
    <circle cx="428" cy="175" r="3.5"/>
    <circle cx="460" cy="160" r="3"/>
    <circle cx="435" cy="155" r="3"/>
  </g>
  <text x="470" y="158" font-family="monospace" font-size="9" fill="#ef4444">ghost</text>
  <text x="470" y="170" font-family="monospace" font-size="9" fill="#ef4444">points</text>

  <!-- === SLAM trajectory panel (right side) === -->
  <line x1="550" y1="72" x2="550" y2="430" stroke="#1e293b" stroke-width="1.5"/>
  <text x="668" y="88" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#475569">Localization Result</text>

  <!-- Ground truth path -->
  <polyline points="580,110 600,150 608,195 610,240 608,285 600,325 590,360" fill="none" stroke="#22c55e" stroke-width="2" opacity="0.7" stroke-dasharray="6,3"/>
  <text x="720" y="155" font-family="monospace" font-size="8" fill="#22c55e">ground truth</text>
  <line x1="673" y1="152" x2="700" y2="152" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="5,2"/>

  <!-- Drifted SLAM path (attack result) -->
  <polyline points="580,110 615,155 640,200 665,240 680,272 685,300 670,330" fill="none" stroke="#ef4444" stroke-width="2.2" opacity="0.9"/>
  <text x="688" y="304" font-family="monospace" font-size="8" fill="#ef4444">drifted</text>

  <!-- Drift error annotation -->
  <line x1="600" y1="325" x2="670" y2="330" stroke="#f59e0b" stroke-width="1.2" stroke-dasharray="3,2"/>
  <text x="605" y="348" font-family="monospace" font-size="8" fill="#f59e0b">APE: up to 6.03 m</text>

  <!-- Divergence arrows at several points -->
  <line x1="608" y1="240" x2="665" y2="240" stroke="#f59e0b" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>
  <line x1="608" y1="285" x2="680" y2="272" stroke="#f59e0b" stroke-width="1" stroke-dasharray="2,2" opacity="0.6"/>

  <!-- Stats box -->
  <rect x="558" y="368" width="220" height="54" rx="5" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <text x="668" y="385" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#94a3b8">3 SLAM systems tested</text>
  <text x="668" y="399" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#ef4444">6.1× mean pose error (vs random)</text>
  <text x="668" y="413" text-anchor="middle" font-family="monospace" font-size="8.5" fill="#f59e0b">2.29 – 3.31 m avg trajectory error</text>

  <!-- Legend -->
  <line x1="42" y1="415" x2="62" y2="415" stroke="#38bdf8" stroke-width="2"/>
  <text x="68" y="419" font-family="monospace" font-size="9" fill="#94a3b8">incident beam</text>
  <line x1="160" y1="415" x2="180" y2="415" stroke="#ef4444" stroke-width="2"/>
  <text x="186" y="419" font-family="monospace" font-size="9" fill="#94a3b8">reflected (ghost)</text>
  <circle cx="290" cy="415" r="4" fill="#ef4444"/>
  <text x="298" y="419" font-family="monospace" font-size="9" fill="#94a3b8">ghost points</text>
  <line x1="385" y1="415" x2="405" y2="415" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="5,2"/>
  <text x="411" y="419" font-family="monospace" font-size="9" fill="#94a3b8">ground truth path</text>
</svg>
