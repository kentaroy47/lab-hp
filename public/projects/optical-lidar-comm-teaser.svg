<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#031a0c"/>
      <stop offset="100%" stop-color="#063d1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="35%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="src" cx="0%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <ellipse cx="280" cy="205" rx="300" ry="220" fill="url(#glow)"/>
  <!-- Infrastructure tower -->
  <rect x="120" y="120" width="10" height="180" fill="#4ade80" opacity="0.7"/>
  <polygon points="115,120 130,120 122,100" fill="#4ade80" opacity="0.8"/>
  <rect x="116" y="155" width="8" height="4" fill="#86efac" opacity="0.6"/>
  <rect x="116" y="175" width="8" height="4" fill="#86efac" opacity="0.6"/>
  <rect x="116" y="195" width="8" height="4" fill="#86efac" opacity="0.6"/>
  <!-- LiDAR beam from tower to vehicle -->
  <line x1="130" y1="140" x2="480" y2="290" stroke="#34d399" stroke-width="2" opacity="0.7"/>
  <line x1="130" y1="148" x2="480" y2="298" stroke="#34d399" stroke-width="1.2" opacity="0.4"/>
  <!-- Pulse dots along beam -->
  <circle cx="200" cy="178" r="4" fill="#6ee7b7" opacity="0.9"/>
  <circle cx="270" cy="208" r="3.5" fill="#6ee7b7" opacity="0.8"/>
  <circle cx="340" cy="238" r="4" fill="#6ee7b7" opacity="0.9"/>
  <circle cx="410" cy="268" r="3.5" fill="#6ee7b7" opacity="0.7"/>
  <!-- Data packets along beam -->
  <rect x="222" y="184" width="12" height="8" rx="2" fill="#34d399" opacity="0.85"/>
  <rect x="295" y="214" width="12" height="8" rx="2" fill="#34d399" opacity="0.85"/>
  <rect x="368" y="244" width="12" height="8" rx="2" fill="#34d399" opacity="0.85"/>
  <!-- Vehicle (simple car shape) -->
  <rect x="475" y="278" width="70" height="30" rx="5" fill="#059669" opacity="0.8"/>
  <rect x="488" y="260" width="44" height="22" rx="4" fill="#065f46" opacity="0.8"/>
  <circle cx="490" cy="310" r="9" fill="#111" opacity="0.9"/><circle cx="490" cy="310" r="5" fill="#374151" opacity="0.7"/>
  <circle cx="532" cy="310" r="9" fill="#111" opacity="0.9"/><circle cx="532" cy="310" r="5" fill="#374151" opacity="0.7"/>
  <!-- LiDAR sensor on vehicle roof -->
  <circle cx="510" cy="258" r="6" fill="#34d399" opacity="0.9"/>
  <!-- Road -->
  <rect x="60" y="320" width="680" height="40" rx="4" fill="#0d2d14" opacity="0.6"/>
  <rect x="200" y="336" width="60" height="8" rx="2" fill="#4ade80" opacity="0.25"/>
  <rect x="370" y="336" width="60" height="8" rx="2" fill="#4ade80" opacity="0.25"/>
  <rect x="540" y="336" width="60" height="8" rx="2" fill="#4ade80" opacity="0.25"/>
  <!-- Point cloud from vehicle LiDAR -->
  <circle cx="580" cy="280" r="2" fill="#86efac" opacity="0.6"/>
  <circle cx="600" cy="270" r="1.5" fill="#86efac" opacity="0.5"/>
  <circle cx="620" cy="285" r="2" fill="#86efac" opacity="0.6"/>
  <circle cx="640" cy="275" r="1.5" fill="#86efac" opacity="0.5"/>
  <circle cx="595" cy="262" r="1.5" fill="#86efac" opacity="0.45"/>
  <!-- Title -->
  <text x="400" y="90" font-family="system-ui,-apple-system,sans-serif" font-size="38" font-weight="800" fill="white" text-anchor="middle" opacity="0.95">Optical LiDAR Comm</text>
  <text x="400" y="128" font-family="system-ui,-apple-system,sans-serif" font-size="16" fill="#6ee7b7" text-anchor="middle" letter-spacing="2">RA-L 2025</text>
  <!-- Label -->
  <rect x="310" y="195" width="88" height="20" rx="4" fill="#059669" opacity="0.85"/>
  <text x="354" y="209" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="white" text-anchor="middle">LiDAR → I2V</text>
</svg>
