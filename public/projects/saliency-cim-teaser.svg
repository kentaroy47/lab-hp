<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051a1e"/>
      <stop offset="100%" stop-color="#083038"/>
    </linearGradient>
    <radialGradient id="glow" cx="45%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <ellipse cx="360" cy="225" rx="320" ry="220" fill="url(#glow)"/>
  <!-- Saliency heatmap grid (8x6) - input feature map -->
  <!-- Row 0 - low saliency -->
  <rect x="90"  y="100" width="52" height="42" rx="2" fill="#164e63" opacity="0.7"/>
  <rect x="148" y="100" width="52" height="42" rx="2" fill="#155e75" opacity="0.65"/>
  <rect x="206" y="100" width="52" height="42" rx="2" fill="#164e63" opacity="0.6"/>
  <rect x="264" y="100" width="52" height="42" rx="2" fill="#0e4d5a" opacity="0.65"/>
  <!-- Row 1 - mixed -->
  <rect x="90"  y="148" width="52" height="42" rx="2" fill="#155e75" opacity="0.65"/>
  <rect x="148" y="148" width="52" height="42" rx="2" fill="#0891b2" opacity="0.75"/>
  <rect x="206" y="148" width="52" height="42" rx="2" fill="#06b6d4" opacity="0.85"/>
  <rect x="264" y="148" width="52" height="42" rx="2" fill="#22d3ee" opacity="0.9"/>
  <!-- Row 2 - high saliency (salient region) -->
  <rect x="90"  y="196" width="52" height="42" rx="2" fill="#0891b2" opacity="0.8"/>
  <rect x="148" y="196" width="52" height="42" rx="2" fill="#22d3ee" opacity="0.95"/>
  <rect x="206" y="196" width="52" height="42" rx="2" fill="#67e8f9" opacity="1.0"/>
  <rect x="264" y="196" width="52" height="42" rx="2" fill="#a5f3fc" opacity="1.0"/>
  <!-- Row 3 - high / medium -->
  <rect x="90"  y="244" width="52" height="42" rx="2" fill="#0891b2" opacity="0.75"/>
  <rect x="148" y="244" width="52" height="42" rx="2" fill="#06b6d4" opacity="0.85"/>
  <rect x="206" y="244" width="52" height="42" rx="2" fill="#22d3ee" opacity="0.9"/>
  <rect x="264" y="244" width="52" height="42" rx="2" fill="#06b6d4" opacity="0.8"/>
  <!-- Row 4 - low -->
  <rect x="90"  y="292" width="52" height="42" rx="2" fill="#164e63" opacity="0.6"/>
  <rect x="148" y="292" width="52" height="42" rx="2" fill="#155e75" opacity="0.65"/>
  <rect x="206" y="292" width="52" height="42" rx="2" fill="#164e63" opacity="0.6"/>
  <rect x="264" y="292" width="52" height="42" rx="2" fill="#0e4d5a" opacity="0.55"/>
  <!-- Saliency label -->
  <text x="172" y="95" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#67e8f9" text-anchor="middle" opacity="0.85">Input Feature Map</text>
  <!-- Arrow -->
  <line x1="360" y1="225" x2="415" y2="225" stroke="#22d3ee" stroke-width="2.5" opacity="0.8"/>
  <polygon points="415,219 430,225 415,231" fill="#22d3ee" opacity="0.8"/>
  <!-- CIM macro (processed) -->
  <!-- Non-salient rows skipped (X marks) -->
  <rect x="440" y="100" width="52" height="42" rx="2" fill="#0c2a2f" opacity="0.5"/>
  <line x1="444" y1="104" x2="488" y2="138" stroke="#ef4444" stroke-width="1.5" opacity="0.6"/>
  <line x1="488" y1="104" x2="444" y2="138" stroke="#ef4444" stroke-width="1.5" opacity="0.6"/>
  <rect x="498" y="100" width="52" height="42" rx="2" fill="#0c2a2f" opacity="0.5"/>
  <line x1="502" y1="104" x2="546" y2="138" stroke="#ef4444" stroke-width="1.5" opacity="0.6"/>
  <line x1="546" y1="104" x2="502" y2="138" stroke="#ef4444" stroke-width="1.5" opacity="0.6"/>
  <!-- Salient rows computed (glowing) -->
  <rect x="440" y="148" width="52" height="42" rx="2" fill="#06b6d4" opacity="0.8"/>
  <rect x="498" y="148" width="52" height="42" rx="2" fill="#22d3ee" opacity="0.9"/>
  <rect x="440" y="196" width="52" height="42" rx="2" fill="#22d3ee" opacity="0.95"/>
  <rect x="498" y="196" width="52" height="42" rx="2" fill="#67e8f9" opacity="1.0"/>
  <rect x="440" y="244" width="52" height="42" rx="2" fill="#06b6d4" opacity="0.85"/>
  <rect x="498" y="244" width="52" height="42" rx="2" fill="#22d3ee" opacity="0.9"/>
  <!-- Bottom rows skipped -->
  <rect x="440" y="292" width="52" height="42" rx="2" fill="#0c2a2f" opacity="0.5"/>
  <line x1="444" y1="296" x2="488" y2="330" stroke="#ef4444" stroke-width="1.5" opacity="0.6"/>
  <line x1="488" y1="296" x2="444" y2="330" stroke="#ef4444" stroke-width="1.5" opacity="0.6"/>
  <rect x="498" y="292" width="52" height="42" rx="2" fill="#0c2a2f" opacity="0.5"/>
  <line x1="502" y1="296" x2="546" y2="330" stroke="#ef4444" stroke-width="1.5" opacity="0.6"/>
  <line x1="546" y1="296" x2="502" y2="330" stroke="#ef4444" stroke-width="1.5" opacity="0.6"/>
  <text x="469" y="95" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#67e8f9" text-anchor="middle" opacity="0.85">CIM Macro</text>
  <!-- Efficiency badge -->
  <rect x="590" y="180" width="145" height="50" rx="8" fill="#0e4d5a" stroke="#22d3ee" stroke-width="1.5" opacity="0.9"/>
  <text x="662" y="204" font-family="system-ui,sans-serif" font-size="13" font-weight="700" fill="#a5f3fc" text-anchor="middle">4541 TOPS/W</text>
  <text x="662" y="222" font-family="system-ui,sans-serif" font-size="10" fill="#67e8f9" text-anchor="middle" opacity="0.8">Saliency-Gated</text>
  <!-- Title -->
  <text x="400" y="382" font-family="system-ui,-apple-system,sans-serif" font-size="38" font-weight="800" fill="white" text-anchor="middle" opacity="0.95">Saliency-Aware CIM</text>
  <text x="400" y="415" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="#67e8f9" text-anchor="middle" letter-spacing="2">ESSERC 2025</text>
</svg>
