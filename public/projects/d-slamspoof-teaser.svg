<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f1a"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="roadGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="redglow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg)"/>

  <!-- Title -->
  <text x="400" y="38" text-anchor="middle" font-family="'Courier New', monospace" font-size="20" font-weight="bold" fill="#f1f5f9">D-SLAMSpoof</text>
  <text x="400" y="58" text-anchor="middle" font-family="'Courier New', monospace" font-size="11" fill="#64748b">Environment-Agnostic LiDAR Spoofing Attack · IROS 2026</text>

  <!-- Divider line -->
  <line x1="40" y1="68" x2="760" y2="68" stroke="#1e293b" stroke-width="1"/>

  <!-- === LEFT PANEL: Feature-rich environment (urban) === -->
  <text x="200" y="88" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#475569">Feature-rich Environment</text>

  <!-- Buildings (environment features) -->
  <rect x="55"  y="160" width="35" height="110" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="100" y="130" width="45" height="140" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="155" y="150" width="30" height="120" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="230" y="140" width="40" height="130" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <rect x="280" y="160" width="30" height="110" fill="#1e293b" stroke="#334155" stroke-width="1"/>
  <!-- Windows -->
  <rect x="62"  y="170" width="8" height="6" fill="#fbbf24" opacity="0.6"/>
  <rect x="76"  y="170" width="8" height="6" fill="#fbbf24" opacity="0.4"/>
  <rect x="108" y="145" width="8" height="6" fill="#fbbf24" opacity="0.6"/>
  <rect x="122" y="145" width="8" height="6" fill="#fbbf24" opacity="0.5"/>
  <rect x="108" y="160" width="8" height="6" fill="#fbbf24" opacity="0.3"/>
  <rect x="162" y="162" width="8" height="6" fill="#fbbf24" opacity="0.6"/>
  <rect x="238" y="155" width="8" height="6" fill="#fbbf24" opacity="0.5"/>
  <rect x="252" y="155" width="8" height="6" fill="#fbbf24" opacity="0.4"/>

  <!-- Road -->
  <rect x="40" y="270" width="320" height="60" fill="url(#roadGrad)" stroke="#334155" stroke-width="0.5"/>
  <line x1="200" y1="270" x2="200" y2="330" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="8,6" opacity="0.5"/>

  <!-- Vehicle with LiDAR -->
  <rect x="158" y="248" width="60" height="28" rx="4" fill="#334155" stroke="#475569" stroke-width="1"/>
  <rect x="163" y="238" width="50" height="16" rx="3" fill="#475569" stroke="#64748b" stroke-width="0.5"/>
  <!-- LiDAR dome -->
  <ellipse cx="188" cy="236" rx="8" ry="5" fill="#0ea5e9" opacity="0.9"/>
  <circle cx="188" cy="234" r="3" fill="#38bdf8"/>
  <text x="188" y="292" text-anchor="middle" font-family="monospace" font-size="8" fill="#94a3b8">ego vehicle</text>

  <!-- Legitimate scan points (green) on buildings -->
  <g fill="#22c55e" filter="url(#glow)" opacity="0.85">
    <circle cx="55"  cy="165" r="2.5"/>
    <circle cx="72"  cy="162" r="2"/>
    <circle cx="90"  cy="160" r="2"/>
    <circle cx="100" cy="155" r="2.5"/>
    <circle cx="118" cy="148" r="2"/>
    <circle cx="140" cy="152" r="2"/>
    <circle cx="155" cy="158" r="2.5"/>
    <circle cx="175" cy="155" r="2"/>
    <circle cx="185" cy="152" r="2"/>
    <circle cx="230" cy="148" r="2.5"/>
    <circle cx="250" cy="145" r="2"/>
    <circle cx="270" cy="150" r="2"/>
    <circle cx="280" cy="158" r="2.5"/>
    <circle cx="300" cy="162" r="2"/>
    <circle cx="315" cy="166" r="2"/>
  </g>

  <!-- Scan rays from LiDAR to buildings (green) -->
  <g stroke="#22c55e" stroke-width="0.6" opacity="0.3">
    <line x1="188" y1="234" x2="55"  y2="165"/>
    <line x1="188" y1="234" x2="100" y2="155"/>
    <line x1="188" y1="234" x2="155" y2="158"/>
    <line x1="188" y1="234" x2="230" y2="148"/>
    <line x1="188" y1="234" x2="280" y2="158"/>
  </g>

  <!-- === Dynamic Injection: Red ghost points blended into environment === -->
  <!-- Ghost points injected near building corners (hard to distinguish) -->
  <g fill="#ef4444" filter="url(#redglow)" opacity="0.9">
    <circle cx="93"  cy="158" r="3"/>
    <circle cx="148" cy="149" r="3"/>
    <circle cx="193" cy="148" r="3.5"/>
    <circle cx="207" cy="151" r="2.5"/>
    <circle cx="260" cy="147" r="3"/>
    <circle cx="275" cy="154" r="2.5"/>
    <circle cx="308" cy="159" r="3"/>
  </g>
  <!-- Injection rays (red, dashed) -->
  <g stroke="#ef4444" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.5">
    <line x1="188" y1="234" x2="93"  y2="158"/>
    <line x1="188" y1="234" x2="193" y2="148"/>
    <line x1="188" y1="234" x2="260" y2="147"/>
    <line x1="188" y1="234" x2="308" y2="159"/>
  </g>

  <!-- Scan matching arrows (showing matched correspondences being biased) -->
  <g stroke="#f59e0b" stroke-width="1" marker-end="url(#arrow)" opacity="0.7">
    <line x1="100" y1="155" x2="93"  y2="158"/>
    <line x1="155" y1="158" x2="148" y2="149"/>
    <line x1="185" y1="152" x2="193" y2="148"/>
  </g>

  <!-- === RIGHT PANEL: ISD-SLAM defense === -->
  <line x1="390" y1="72" x2="390" y2="420" stroke="#1e293b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="590" y="88" text-anchor="middle" font-family="'Courier New', monospace" font-size="10" fill="#475569">ISD-SLAM Defense</text>

  <!-- IMU / Inertial sensor icon -->
  <rect x="490" y="110" width="80" height="50" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5"/>
  <text x="530" y="131" text-anchor="middle" font-family="monospace" font-size="9" fill="#94a3b8">IMU</text>
  <text x="530" y="148" text-anchor="middle" font-family="monospace" font-size="8" fill="#64748b">dead-reckoning</text>
  <!-- IMU symbol -->
  <circle cx="530" cy="140" r="0" fill="none"/>
  <!-- Acceleration arrows -->
  <line x1="505" y1="135" x2="518" y2="125" stroke="#38bdf8" stroke-width="1.5" marker-end="url(#arrowblue)"/>
  <line x1="510" y1="140" x2="510" y2="125" stroke="#38bdf8" stroke-width="1.5"/>
  <line x1="515" y1="140" x2="528" y2="140" stroke="#38bdf8" stroke-width="1.5"/>

  <!-- Dead-reckoning trajectory (clean, blue) -->
  <polyline points="530,160 540,185 545,210 548,240 545,265 538,285" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.8" stroke-dasharray="5,3"/>
  <text x="558" y="195" font-family="monospace" font-size="8" fill="#38bdf8">predicted</text>
  <text x="558" y="207" font-family="monospace" font-size="8" fill="#38bdf8">trajectory</text>

  <!-- LiDAR SLAM trajectory (drifting, red) -->
  <polyline points="530,160 555,190 575,222 600,248 620,262 638,258" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.8"/>
  <text x="642" y="255" font-family="monospace" font-size="8" fill="#ef4444">drifted</text>
  <text x="642" y="267" font-family="monospace" font-size="8" fill="#ef4444">(attack)</text>

  <!-- Divergence zone -->
  <polygon points="530,160 548,240 538,285 545,265 548,240 545,210 540,185 620,262 600,248 575,222 555,190" fill="#ef4444" opacity="0.05"/>

  <!-- Detection alert -->
  <rect x="490" y="298" width="160" height="36" rx="6" fill="#1e293b" stroke="#ef4444" stroke-width="1.5"/>
  <text x="570" y="314" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#ef4444">⚠ Attack Detected</text>
  <text x="570" y="327" text-anchor="middle" font-family="monospace" font-size="8" fill="#94a3b8">IMU vs LiDAR divergence</text>

  <!-- Arrow: detection → mitigation -->
  <line x1="570" y1="334" x2="570" y2="358" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="3,2"/>
  <polygon points="564,358 576,358 570,368" fill="#22c55e"/>
  <rect x="490" y="368" width="160" height="30" rx="6" fill="#1e293b" stroke="#22c55e" stroke-width="1.5"/>
  <text x="570" y="381" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#22c55e">✓ Drift Mitigated</text>
  <text x="570" y="393" text-anchor="middle" font-family="monospace" font-size="8" fill="#94a3b8">inertial correction</text>

  <!-- Legend -->
  <circle cx="50" cy="415" r="4" fill="#22c55e"/>
  <text x="60" y="419" font-family="monospace" font-size="9" fill="#94a3b8">legit LiDAR scan</text>
  <circle cx="170" cy="415" r="4" fill="#ef4444"/>
  <text x="180" y="419" font-family="monospace" font-size="9" fill="#94a3b8">injected ghost points</text>
  <line x1="300" y1="415" x2="320" y2="415" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,2"/>
  <text x="326" y="419" font-family="monospace" font-size="9" fill="#94a3b8">IMU dead-reckoning</text>
</svg>
