<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041a10"/>
      <stop offset="100%" stop-color="#07301c"/>
    </linearGradient>
    <radialGradient id="glow" cx="45%" cy="52%" r="45%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <ellipse cx="360" cy="235" rx="300" ry="210" fill="url(#glow)"/>
  <!-- Map grid -->
  <line x1="100" y1="120" x2="700" y2="120" stroke="#064e2e" stroke-width="1" opacity="0.5"/>
  <line x1="100" y1="170" x2="700" y2="170" stroke="#064e2e" stroke-width="1" opacity="0.5"/>
  <line x1="100" y1="220" x2="700" y2="220" stroke="#064e2e" stroke-width="1" opacity="0.5"/>
  <line x1="100" y1="270" x2="700" y2="270" stroke="#064e2e" stroke-width="1" opacity="0.5"/>
  <line x1="100" y1="320" x2="700" y2="320" stroke="#064e2e" stroke-width="1" opacity="0.5"/>
  <line x1="150" y1="90" x2="150" y2="380" stroke="#064e2e" stroke-width="1" opacity="0.5"/>
  <line x1="250" y1="90" x2="250" y2="380" stroke="#064e2e" stroke-width="1" opacity="0.5"/>
  <line x1="350" y1="90" x2="350" y2="380" stroke="#064e2e" stroke-width="1" opacity="0.5"/>
  <line x1="450" y1="90" x2="450" y2="380" stroke="#064e2e" stroke-width="1" opacity="0.5"/>
  <line x1="550" y1="90" x2="550" y2="380" stroke="#064e2e" stroke-width="1" opacity="0.5"/>
  <line x1="650" y1="90" x2="650" y2="380" stroke="#064e2e" stroke-width="1" opacity="0.5"/>
  <!-- True trajectory (smooth curve) -->
  <path d="M 160 340 Q 200 280 260 240 Q 330 195 400 190 Q 470 188 530 210 Q 590 232 620 270" fill="none" stroke="#34d399" stroke-width="3" opacity="0.9" stroke-linecap="round"/>
  <!-- True waypoints -->
  <circle cx="160" cy="340" r="5" fill="#34d399" opacity="0.9"/>
  <circle cx="300" cy="215" r="5" fill="#34d399" opacity="0.9"/>
  <circle cx="450" cy="190" r="5" fill="#34d399" opacity="0.9"/>
  <circle cx="620" cy="270" r="5" fill="#34d399" opacity="0.9"/>
  <!-- Spoofed/manipulated trajectory -->
  <path d="M 160 340 Q 200 280 260 240 Q 310 230 360 265 Q 420 310 480 330 Q 560 355 620 310" fill="none" stroke="#f87171" stroke-width="2.5" stroke-dasharray="10 6" opacity="0.85"/>
  <!-- Spoof injection point -->
  <circle cx="360" cy="265" r="10" fill="none" stroke="#ef4444" stroke-width="2" opacity="0.9"/>
  <circle cx="360" cy="265" r="4" fill="#ef4444" opacity="0.9"/>
  <!-- Attacker -->
  <circle cx="360" cy="160" r="14" fill="#dc2626" opacity="0.25"/>
  <circle cx="360" cy="160" r="8" fill="#ef4444" opacity="0.8"/>
  <line x1="360" y1="168" x2="360" y2="255" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="6 4" opacity="0.7"/>
  <!-- Vehicle at spoof point -->
  <rect x="344" y="256" width="32" height="18" rx="4" fill="#1d4ed8" opacity="0.85"/>
  <circle cx="350" cy="277" r="5" fill="#111" opacity="0.8"/>
  <circle cx="370" cy="277" r="5" fill="#111" opacity="0.8"/>
  <!-- Labels -->
  <rect x="420" y="183" width="72" height="18" rx="4" fill="#059669" opacity="0.85"/>
  <text x="456" y="196" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="white" text-anchor="middle">True Path</text>
  <rect x="510" y="348" width="90" height="18" rx="4" fill="#dc2626" opacity="0.85"/>
  <text x="555" y="361" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="white" text-anchor="middle">Spoofed Path</text>
  <!-- Title -->
  <text x="400" y="65" font-family="system-ui,-apple-system,sans-serif" font-size="46" font-weight="800" fill="white" text-anchor="middle" opacity="0.95">SLAMSpoof</text>
  <text x="400" y="102" font-family="system-ui,-apple-system,sans-serif" font-size="16" fill="#6ee7b7" text-anchor="middle" letter-spacing="2">ICRA 2025</text>
</svg>
