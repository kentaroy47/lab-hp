<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050d1a"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <radialGradient id="glowL" cx="20%" cy="45%" r="42%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowC" cx="50%" cy="45%" r="38%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="80%" cy="45%" r="42%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <ellipse cx="160" cy="200" rx="210" ry="190" fill="url(#glowL)"/>
  <ellipse cx="400" cy="200" rx="200" ry="180" fill="url(#glowC)"/>
  <ellipse cx="650" cy="200" rx="210" ry="190" fill="url(#glowR)"/>

  <!-- Degraded scenes (left) -->
  <rect x="34" y="72" width="190" height="248" rx="8" fill="#0f1e30" stroke="#f59e0b" stroke-width="1.2" opacity="0.9"/>
  <text x="129" y="95" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#fcd34d" text-anchor="middle">Degraded Scenes</text>

  <rect x="52" y="108" width="154" height="42" rx="5" fill="#12203a" opacity="0.95"/>
  <rect x="60" y="117" width="24" height="24" rx="3" fill="#1f2937"/>
  <circle cx="72" cy="129" r="5" fill="#f59e0b" opacity="0.35"/>
  <text x="152" y="126" font-family="system-ui,sans-serif" font-size="10" fill="#fcd34d" text-anchor="middle" font-weight="600">Low light</text>
  <text x="152" y="139" font-family="monospace" font-size="8.5" fill="#f59e0b" text-anchor="middle" opacity="0.7">DarkFace</text>

  <rect x="52" y="157" width="154" height="42" rx="5" fill="#12203a" opacity="0.95"/>
  <rect x="60" y="166" width="24" height="24" rx="3" fill="#243447"/>
  <line x1="63" y1="170" x2="69" y2="186" stroke="#93c5fd" stroke-width="1" opacity="0.6"/>
  <line x1="70" y1="170" x2="76" y2="186" stroke="#93c5fd" stroke-width="1" opacity="0.6"/>
  <text x="152" y="175" font-family="system-ui,sans-serif" font-size="10" fill="#fcd34d" text-anchor="middle" font-weight="600">Rain / Haze</text>
  <text x="152" y="188" font-family="monospace" font-size="8.5" fill="#f59e0b" text-anchor="middle" opacity="0.7">weather</text>

  <rect x="52" y="206" width="154" height="42" rx="5" fill="#12203a" opacity="0.95"/>
  <rect x="60" y="215" width="24" height="24" rx="3" fill="#2a2f3a"/>
  <rect x="63" y="218" width="18" height="18" rx="2" fill="#6b7280" opacity="0.4"/>
  <text x="152" y="224" font-family="system-ui,sans-serif" font-size="10" fill="#fcd34d" text-anchor="middle" font-weight="600">Blur / Noise</text>
  <text x="152" y="237" font-family="monospace" font-size="8.5" fill="#f59e0b" text-anchor="middle" opacity="0.7">6 benchmarks</text>

  <rect x="52" y="258" width="154" height="46" rx="5" fill="#2d1c00" opacity="0.85" stroke="#f59e0b" stroke-width="0.8"/>
  <text x="129" y="277" font-family="system-ui,sans-serif" font-size="10" fill="#fcd34d" text-anchor="middle" font-weight="600">Static pipelines</text>
  <text x="129" y="293" font-family="system-ui,sans-serif" font-size="9" fill="#f59e0b" text-anchor="middle" opacity="0.85">fail to generalize</text>

  <line x1="226" y1="196" x2="256" y2="196" stroke="#a78bfa" stroke-width="2" opacity="0.85"/>
  <polygon points="256,190 270,196 256,202" fill="#a78bfa" opacity="0.85"/>

  <!-- DetAS agent (center) -->
  <rect x="274" y="60" width="252" height="272" rx="8" fill="#0f1e30" stroke="#a78bfa" stroke-width="1.5" opacity="0.95"/>
  <text x="400" y="83" font-family="system-ui,sans-serif" font-size="12" font-weight="700" fill="#c4b5fd" text-anchor="middle">DetAS — MLLM Agent</text>

  <rect x="290" y="94" width="220" height="30" rx="5" fill="#2e1065" opacity="0.9" stroke="#7c3aed" stroke-width="0.8"/>
  <text x="400" y="107" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#c4b5fd" text-anchor="middle">Detection as a decision process</text>
  <text x="400" y="119" font-family="system-ui,sans-serif" font-size="8.5" fill="#a78bfa" text-anchor="middle" opacity="0.85">composes its own workflow per scene</text>

  <rect x="290" y="132" width="220" height="42" rx="4" fill="#1e1b4b" opacity="0.88"/>
  <text x="400" y="148" font-family="system-ui,sans-serif" font-size="9.5" fill="#c4b5fd" text-anchor="middle" font-weight="600">① Self-Adaptive Image Restoration</text>
  <text x="400" y="164" font-family="system-ui,sans-serif" font-size="8.5" fill="#a78bfa" text-anchor="middle" opacity="0.85">decides whether &amp; how to enhance</text>

  <rect x="290" y="181" width="220" height="42" rx="4" fill="#1e1b4b" opacity="0.88"/>
  <text x="400" y="197" font-family="system-ui,sans-serif" font-size="9.5" fill="#c4b5fd" text-anchor="middle" font-weight="600">② Multi-Expertise Detection</text>
  <text x="400" y="213" font-family="system-ui,sans-serif" font-size="8.5" fill="#a78bfa" text-anchor="middle" opacity="0.85">instance-level reasoning over experts</text>

  <rect x="290" y="230" width="220" height="42" rx="4" fill="#1e1b4b" opacity="0.88"/>
  <text x="400" y="246" font-family="system-ui,sans-serif" font-size="9.5" fill="#c4b5fd" text-anchor="middle" font-weight="600">③ Self-Evolving Experience</text>
  <text x="400" y="262" font-family="system-ui,sans-serif" font-size="8.5" fill="#a78bfa" text-anchor="middle" opacity="0.85">DetAS-X reuses past decisions</text>

  <!-- Toolbox strip -->
  <rect x="290" y="281" width="220" height="38" rx="5" fill="#161b3d" opacity="0.9"/>
  <text x="400" y="295" font-family="system-ui,sans-serif" font-size="8.5" fill="#a78bfa" text-anchor="middle" opacity="0.9">TOOLBOX</text>
  <rect x="300" y="300" width="44" height="14" rx="3" fill="#3b2f6b"/>
  <text x="322" y="310" font-family="monospace" font-size="7.5" fill="#c4b5fd" text-anchor="middle">restore</text>
  <rect x="349" y="300" width="44" height="14" rx="3" fill="#3b2f6b"/>
  <text x="371" y="310" font-family="monospace" font-size="7.5" fill="#c4b5fd" text-anchor="middle">denoise</text>
  <rect x="398" y="300" width="50" height="14" rx="3" fill="#3b2f6b"/>
  <text x="423" y="310" font-family="monospace" font-size="7.5" fill="#c4b5fd" text-anchor="middle">det-A</text>
  <rect x="453" y="300" width="50" height="14" rx="3" fill="#3b2f6b"/>
  <text x="478" y="310" font-family="monospace" font-size="7.5" fill="#c4b5fd" text-anchor="middle">det-B</text>

  <line x1="528" y1="196" x2="558" y2="196" stroke="#10b981" stroke-width="2" opacity="0.85"/>
  <polygon points="558,190 572,196 558,202" fill="#10b981" opacity="0.85"/>

  <!-- Results (right) -->
  <rect x="576" y="72" width="190" height="248" rx="8" fill="#0f1e30" stroke="#10b981" stroke-width="1.2" opacity="0.9"/>
  <text x="671" y="95" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#6ee7b7" text-anchor="middle">DetAS-X Results</text>

  <rect x="594" y="108" width="154" height="52" rx="6" fill="#04352a" opacity="0.9"/>
  <text x="671" y="133" font-family="system-ui,sans-serif" font-size="22" font-weight="800" fill="#10b981" text-anchor="middle">+28.36%</text>
  <text x="671" y="150" font-family="system-ui,sans-serif" font-size="9" fill="#6ee7b7" text-anchor="middle">average F1 improvement</text>

  <rect x="594" y="168" width="154" height="52" rx="6" fill="#04352a" opacity="0.9"/>
  <text x="671" y="193" font-family="system-ui,sans-serif" font-size="22" font-weight="800" fill="#10b981" text-anchor="middle">+37.01%</text>
  <text x="671" y="210" font-family="system-ui,sans-serif" font-size="9" fill="#6ee7b7" text-anchor="middle">on DarkFace</text>

  <rect x="594" y="228" width="154" height="34" rx="4" fill="#0d3d33" opacity="0.85"/>
  <text x="671" y="243" font-family="system-ui,sans-serif" font-size="9.5" fill="#6ee7b7" text-anchor="middle" font-weight="600">6 challenging benchmarks</text>
  <text x="671" y="256" font-family="system-ui,sans-serif" font-size="8.5" fill="#34d399" text-anchor="middle" opacity="0.85">vs. existing MLLM detectors</text>

  <rect x="594" y="270" width="154" height="34" rx="4" fill="#0d3d33" opacity="0.8"/>
  <text x="671" y="285" font-family="system-ui,sans-serif" font-size="9.5" fill="#6ee7b7" text-anchor="middle" font-weight="600">No retraining required</text>
  <text x="671" y="298" font-family="system-ui,sans-serif" font-size="8.5" fill="#34d399" text-anchor="middle" opacity="0.85">adapts at inference time</text>

  <!-- Title -->
  <text x="400" y="378" font-family="system-ui,-apple-system,sans-serif" font-size="44" font-weight="800" fill="white" text-anchor="middle" opacity="0.95">DetAS</text>
  <text x="400" y="406" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#c4b5fd" text-anchor="middle">Agentic Object Detection in Any Scene</text>
  <text x="400" y="430" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a78bfa" text-anchor="middle" letter-spacing="2">arXiv 2026</text>
</svg>
