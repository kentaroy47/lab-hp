<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#041820"/>
      <stop offset="100%" stop-color="#072a35"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="48%" r="50%">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <ellipse cx="400" cy="220" rx="340" ry="220" fill="url(#glow)"/>

  <!-- Config A: CNN mode (4 caps in parallel, coarse precision) -->
  <rect x="80" y="100" width="260" height="200" rx="8" fill="#072030" stroke="#0891b2" stroke-width="1.5" opacity="0.8"/>
  <text x="210" y="122" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#67e8f9" text-anchor="middle">CNN Mode</text>
  <!-- 4 capacitors side by side -->
  <!-- Cap 1 -->
  <line x1="130" y1="145" x2="130" y2="175" stroke="#22d3ee" stroke-width="2" opacity="0.85"/>
  <line x1="115" y1="175" x2="145" y2="175" stroke="#22d3ee" stroke-width="3" opacity="0.9"/>
  <line x1="115" y1="183" x2="145" y2="183" stroke="#22d3ee" stroke-width="3" opacity="0.9"/>
  <line x1="130" y1="183" x2="130" y2="213" stroke="#22d3ee" stroke-width="2" opacity="0.85"/>
  <!-- Cap 2 -->
  <line x1="175" y1="145" x2="175" y2="175" stroke="#22d3ee" stroke-width="2" opacity="0.85"/>
  <line x1="160" y1="175" x2="190" y2="175" stroke="#22d3ee" stroke-width="3" opacity="0.9"/>
  <line x1="160" y1="183" x2="190" y2="183" stroke="#22d3ee" stroke-width="3" opacity="0.9"/>
  <line x1="175" y1="183" x2="175" y2="213" stroke="#22d3ee" stroke-width="2" opacity="0.85"/>
  <!-- Cap 3 -->
  <line x1="220" y1="145" x2="220" y2="175" stroke="#22d3ee" stroke-width="2" opacity="0.85"/>
  <line x1="205" y1="175" x2="235" y2="175" stroke="#22d3ee" stroke-width="3" opacity="0.9"/>
  <line x1="205" y1="183" x2="235" y2="183" stroke="#22d3ee" stroke-width="3" opacity="0.9"/>
  <line x1="220" y1="183" x2="220" y2="213" stroke="#22d3ee" stroke-width="2" opacity="0.85"/>
  <!-- Cap 4 -->
  <line x1="265" y1="145" x2="265" y2="175" stroke="#22d3ee" stroke-width="2" opacity="0.85"/>
  <line x1="250" y1="175" x2="280" y2="175" stroke="#22d3ee" stroke-width="3" opacity="0.9"/>
  <line x1="250" y1="183" x2="280" y2="183" stroke="#22d3ee" stroke-width="3" opacity="0.9"/>
  <line x1="265" y1="183" x2="265" y2="213" stroke="#22d3ee" stroke-width="2" opacity="0.85"/>
  <!-- Parallel connection lines -->
  <line x1="130" y1="145" x2="265" y2="145" stroke="#22d3ee" stroke-width="1.5" opacity="0.6"/>
  <line x1="130" y1="213" x2="265" y2="213" stroke="#22d3ee" stroke-width="1.5" opacity="0.6"/>
  <text x="210" y="240" font-family="system-ui,sans-serif" font-size="10" fill="#a5f3fc" text-anchor="middle" opacity="0.85">818 TOPS/W · Low Precision</text>
  <rect x="145" y="252" width="130" height="28" rx="5" fill="#0891b2" opacity="0.75"/>
  <text x="210" y="271" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="white" text-anchor="middle">4× parallel caps</text>

  <!-- Arrow (reconfiguration) -->
  <text x="370" y="215" font-family="system-ui,sans-serif" font-size="24" fill="#f59e0b" text-anchor="middle" opacity="0.9">⇄</text>
  <text x="370" y="238" font-family="system-ui,sans-serif" font-size="9" fill="#fbbf24" text-anchor="middle" opacity="0.8">Reconfig</text>

  <!-- Config B: Transformer mode (2 caps in series, fine precision) -->
  <rect x="460" y="100" width="260" height="200" rx="8" fill="#072030" stroke="#67e8f9" stroke-width="1.5" opacity="0.9"/>
  <text x="590" y="122" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#a5f3fc" text-anchor="middle">Transformer Mode</text>
  <!-- 2 caps in series (stacked) -->
  <!-- Cap 1 top -->
  <line x1="560" y1="140" x2="560" y2="162" stroke="#67e8f9" stroke-width="2.5" opacity="0.9"/>
  <line x1="540" y1="162" x2="580" y2="162" stroke="#67e8f9" stroke-width="4" opacity="0.95"/>
  <line x1="540" y1="172" x2="580" y2="172" stroke="#67e8f9" stroke-width="4" opacity="0.95"/>
  <!-- Cap 2 bottom -->
  <line x1="560" y1="172" x2="560" y2="192" stroke="#67e8f9" stroke-width="2.5" opacity="0.9"/>
  <line x1="540" y1="192" x2="580" y2="192" stroke="#67e8f9" stroke-width="4" opacity="0.95"/>
  <line x1="540" y1="202" x2="580" y2="202" stroke="#67e8f9" stroke-width="4" opacity="0.95"/>
  <line x1="560" y1="202" x2="560" y2="220" stroke="#67e8f9" stroke-width="2.5" opacity="0.9"/>
  <!-- Cap 3 top -->
  <line x1="620" y1="140" x2="620" y2="162" stroke="#67e8f9" stroke-width="2.5" opacity="0.9"/>
  <line x1="600" y1="162" x2="640" y2="162" stroke="#67e8f9" stroke-width="4" opacity="0.95"/>
  <line x1="600" y1="172" x2="640" y2="172" stroke="#67e8f9" stroke-width="4" opacity="0.95"/>
  <!-- Cap 4 bottom -->
  <line x1="620" y1="172" x2="620" y2="192" stroke="#67e8f9" stroke-width="2.5" opacity="0.9"/>
  <line x1="600" y1="192" x2="640" y2="192" stroke="#67e8f9" stroke-width="4" opacity="0.95"/>
  <line x1="600" y1="202" x2="640" y2="202" stroke="#67e8f9" stroke-width="4" opacity="0.95"/>
  <line x1="620" y1="202" x2="620" y2="220" stroke="#67e8f9" stroke-width="2.5" opacity="0.9"/>
  <text x="590" y="240" font-family="system-ui,sans-serif" font-size="10" fill="#a5f3fc" text-anchor="middle" opacity="0.85">4094 TOPS/W · Fine Precision</text>
  <rect x="520" y="252" width="140" height="28" rx="5" fill="#0e7490" opacity="0.85"/>
  <text x="590" y="271" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="white" text-anchor="middle">2× series caps</text>

  <!-- Efficiency range bar -->
  <rect x="90" y="330" width="620" height="18" rx="9" fill="#0a2a35" opacity="0.8"/>
  <rect x="90" y="330" width="620" height="18" rx="9" fill="none" stroke="#0891b2" stroke-width="1" opacity="0.6"/>
  <rect x="90" y="330" width="310" height="18" rx="9" fill="url(#effGrad)" opacity="0.85"/>
  <defs>
    <linearGradient id="effGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
  </defs>
  <text x="90"  y="365" font-family="system-ui,sans-serif" font-size="11" fill="#0891b2">818 TOPS/W</text>
  <text x="710" y="365" font-family="system-ui,sans-serif" font-size="11" fill="#a5f3fc" text-anchor="end">4094 TOPS/W</text>
  <text x="400" y="365" font-family="system-ui,sans-serif" font-size="11" fill="#67e8f9" text-anchor="middle">Dynamic Range</text>

  <!-- Title -->
  <text x="400" y="398" font-family="system-ui,-apple-system,sans-serif" font-size="34" font-weight="800" fill="white" text-anchor="middle" opacity="0.95">Cap-Reconfigured CIM</text>
  <text x="400" y="428" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="#67e8f9" text-anchor="middle" letter-spacing="2">ISSCC 2024</text>
</svg>
