  <rect x="75" y="300" width="14" height="14" rx="2" fill="#7c3aed" opacity="0.9"/>
  <text x="93" y="312" font-family="monospace" font-size="9" fill="#c4b5fd">+1</text>
  <rect x="120" y="300" width="14" height="14" rx="2" fill="#1e1b4b" opacity="0.7" stroke="#4c1d95" stroke-width="0.8"/>
  <text x="138" y="312" font-family="monospace" font-size="9" fill="#c4b5fd"> 0</text>
  <rect x="165" y="300" width="14" height="14" rx="2" fill="#4c1d95" opacity="0.5"/>
  <text x="183" y="312" font-family="monospace" font-size="9" fill="#c4b5fd">−1</text>
  <text x="225" y="312" font-family="monospace" font-size="9" fill="#7c3aed" opacity="0.8">1.58-bit ternary</text>

  <!-- Arrow: ROM → Inference -->
  <line x1="340" y1="200" x2="395" y2="200" stroke="#7c3aed" stroke-width="2.5" opacity="0.8"/>
  <polygon points="395,194 410,200 395,206" fill="#7c3aed" opacity="0.8"/>
  <text x="375" y="192" font-family="system-ui,sans-serif" font-size="9" fill="#a78bfa" text-anchor="middle">No Reload</text>

  <!-- Right panel: innovations + metrics -->
  <rect x="420" y="80" width="340" height="240" rx="8" fill="#100d24" stroke="#a78bfa" stroke-width="1.2" opacity="0.9"/>
  <text x="590" y="103" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#c4b5fd" text-anchor="middle">BitROM Architecture</text>

  <!-- Three innovations -->
  <rect x="438" y="112" width="305" height="22" rx="4" fill="#1e1b4b" opacity="0.8"/>
  <text x="590" y="127" font-family="system-ui,sans-serif" font-size="10" fill="#c4b5fd" text-anchor="middle">① Bidirectional ROM Arrays</text>
  <rect x="438" y="140" width="305" height="22" rx="4" fill="#1e1b4b" opacity="0.8"/>
  <text x="590" y="155" font-family="system-ui,sans-serif" font-size="10" fill="#c4b5fd" text-anchor="middle">② Tri-Mode Local Accumulators</text>
  <rect x="438" y="168" width="305" height="22" rx="4" fill="#1e1b4b" opacity="0.8"/>
  <text x="590" y="183" font-family="system-ui,sans-serif" font-size="10" fill="#c4b5fd" text-anchor="middle">③ Integrated eDRAM KV-Cache</text>

  <!-- DRAM reduction -->
  <rect x="438" y="200" width="305" height="32" rx="5" fill="#2e1065" opacity="0.8" stroke="#7c3aed" stroke-width="0.8"/>
  <text x="590" y="215" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#a78bfa" text-anchor="middle">External DRAM Access −43.6%</text>
  <text x="590" y="228" font-family="system-ui,sans-serif" font-size="10" fill="#c4b5fd" text-anchor="middle" opacity="0.8">during LLM decoding</text>

  <!-- Key metrics -->
  <rect x="438" y="242" width="145" height="56" rx="5" fill="#1e1b4b" opacity="0.85"/>
  <text x="510" y="262" font-family="system-ui,sans-serif" font-size="20" font-weight="800" fill="#a78bfa" text-anchor="middle">20.8</text>
  <text x="510" y="278" font-family="system-ui,sans-serif" font-size="10" fill="#c4b5fd" text-anchor="middle">TOPS/W</text>
  <text x="510" y="292" font-family="system-ui,sans-serif" font-size="9" fill="#7c3aed" text-anchor="middle" opacity="0.8">Energy Efficiency</text>

  <rect x="595" y="242" width="148" height="56" rx="5" fill="#1e1b4b" opacity="0.85"/>
  <text x="669" y="262" font-family="system-ui,sans-serif" font-size="20" font-weight="800" fill="#a78bfa" text-anchor="middle">10×</text>
  <text x="669" y="278" font-family="system-ui,sans-serif" font-size="10" fill="#c4b5fd" text-anchor="middle">Area Efficiency</text>
  <text x="669" y="292" font-family="system-ui,sans-serif" font-size="9" fill="#7c3aed" text-anchor="middle" opacity="0.8">vs. digital CiROM</text>

  <!-- Title -->
  <text x="400" y="378" font-family="system-ui,-apple-system,sans-serif" font-size="42" font-weight="800" fill="white" text-anchor="middle" opacity="0.95">BitROM</text>
  <text x="400" y="410" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#a78bfa" text-anchor="middle">Weight Reload-Free CiROM for 1.58-bit LLM Inference</text>
  <text x="400" y="433" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#7c3aed" text-anchor="middle" letter-spacing="2">ASP-DAC 2026</text>
</svg>
