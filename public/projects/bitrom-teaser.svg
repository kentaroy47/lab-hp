  <text x="190" y="103" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#c4b5fd" text-anchor="middle">CiROM Array (1.58-bit)</text>

  <!-- Ternary weight cells: -1, 0, +1 represented as colors -->
  <!-- Row labels -->
  <text x="68" y="128" font-family="monospace" font-size="9" fill="#7c3aed" opacity="0.8">WL0</text>
