<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051218"/>
      <stop offset="100%" stop-color="#082030"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <ellipse cx="400" cy="225" rx="360" ry="220" fill="url(#glow)"/>

  <!-- Multicolumn CIM array (left) -->
  <rect x="40" y="75" width="320" height="265" rx="8" fill="#0a1e28" stroke="#0891b2" stroke-width="1.2" opacity="0.9"/>
  <text x="200" y="98" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#67e8f9" text-anchor="middle">Multicolumn CIM Array</text>

  <!-- 4 columns -->
  <!-- Col 0 -->
  <rect x="60"  y="112" width="44" height="160" rx="3" fill="#0e3d4a" stroke="#22d3ee" stroke-width="1" opacity="0.9"/>
  <text x="82"  y="128" font-family="monospace" font-size="9" fill="#67e8f9" text-anchor="middle">Col 0</text>
  <rect x="65"  y="133" width="34" height="18" rx="2" fill="#0891b2" opacity="0.85"/>
  <rect x="65"  y="155" width="34" height="18" rx="2" fill="#06b6d4" opacity="0.9"/>
  <rect x="65"  y="177" width="34" height="18" rx="2" fill="#0891b2" opacity="0.8"/>
  <rect x="65"  y="199" width="34" height="18" rx="2" fill="#22d3ee" opacity="0.95"/>
  <rect x="65"  y="221" width="34" height="18" rx="2" fill="#0891b2" opacity="0.85"/>
  <rect x="65"  y="243" width="34" height="14" rx="2" fill="#06b6d4" opacity="0.8"/>

  <!-- Col 1 -->
  <rect x="112" y="112" width="44" height="160" rx="3" fill="#0e3d4a" stroke="#22d3ee" stroke-width="1" opacity="0.9"/>
  <text x="134" y="128" font-family="monospace" font-size="9" fill="#67e8f9" text-anchor="middle">Col 1</text>
  <rect x="117" y="133" width="34" height="18" rx="2" fill="#22d3ee" opacity="0.9"/>
  <rect x="117" y="155" width="34" height="18" rx="2" fill="#0891b2" opacity="0.85"/>
  <rect x="117" y="177" width="34" height="18" rx="2" fill="#06b6d4" opacity="0.9"/>
  <rect x="117" y="199" width="34" height="18" rx="2" fill="#0891b2" opacity="0.8"/>
  <rect x="117" y="221" width="34" height="18" rx="2" fill="#22d3ee" opacity="0.85"/>
  <rect x="117" y="243" width="34" height="14" rx="2" fill="#0891b2" opacity="0.75"/>

  <!-- Col 2 -->
  <rect x="164" y="112" width="44" height="160" rx="3" fill="#0e3d4a" stroke="#22d3ee" stroke-width="1" opacity="0.9"/>
  <text x="186" y="128" font-family="monospace" font-size="9" fill="#67e8f9" text-anchor="middle">Col 2</text>
  <rect x="169" y="133" width="34" height="18" rx="2" fill="#06b6d4" opacity="0.85"/>
  <rect x="169" y="155" width="34" height="18" rx="2" fill="#22d3ee" opacity="0.9"/>
  <rect x="169" y="177" width="34" height="18" rx="2" fill="#0891b2" opacity="0.85"/>
  <rect x="169" y="199" width="34" height="18" rx="2" fill="#06b6d4" opacity="0.9"/>
  <rect x="169" y="221" width="34" height="18" rx="2" fill="#0891b2" opacity="0.8"/>
  <rect x="169" y="243" width="34" height="14" rx="2" fill="#22d3ee" opacity="0.8"/>

  <!-- Col 3 -->
  <rect x="216" y="112" width="44" height="160" rx="3" fill="#0e3d4a" stroke="#22d3ee" stroke-width="1" opacity="0.9"/>
  <text x="238" y="128" font-family="monospace" font-size="9" fill="#67e8f9" text-anchor="middle">Col 3</text>
  <rect x="221" y="133" width="34" height="18" rx="2" fill="#0891b2" opacity="0.9"/>
  <rect x="221" y="155" width="34" height="18" rx="2" fill="#06b6d4" opacity="0.85"/>
  <rect x="221" y="177" width="34" height="18" rx="2" fill="#22d3ee" opacity="0.9"/>
  <rect x="221" y="199" width="34" height="18" rx="2" fill="#0891b2" opacity="0.85"/>
  <rect x="221" y="221" width="34" height="18" rx="2" fill="#06b6d4" opacity="0.9"/>
  <rect x="221" y="243" width="34" height="14" rx="2" fill="#0891b2" opacity="0.8"/>

  <!-- Residue accumulation arrow (down) -->
  <line x1="82"  y1="280" x2="82"  y2="308" stroke="#22d3ee" stroke-width="1.5" opacity="0.8" stroke-dasharray="3,2"/>
  <line x1="134" y1="280" x2="134" y2="308" stroke="#22d3ee" stroke-width="1.5" opacity="0.8" stroke-dasharray="3,2"/>
  <line x1="186" y1="280" x2="186" y2="308" stroke="#22d3ee" stroke-width="1.5" opacity="0.8" stroke-dasharray="3,2"/>
  <line x1="238" y1="280" x2="238" y2="308" stroke="#22d3ee" stroke-width="1.5" opacity="0.8" stroke-dasharray="3,2"/>

  <!-- Residue accumulator bar -->
  <rect x="60" y="308" width="200" height="22" rx="4" fill="#065f46" stroke="#34d399" stroke-width="1" opacity="0.9"/>
  <text x="160" y="323" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#a7f3d0" text-anchor="middle">Residue Accumulator</text>

  <!-- Label -->
  <text x="200" y="352" font-family="system-ui,sans-serif" font-size="10" fill="#a5f3fc" text-anchor="middle" opacity="0.85">M-Input ΣΔ ADC</text>

  <!-- Arrow to right panel -->
  <line x1="368" y1="207" x2="418" y2="207" stroke="#0891b2" stroke-width="2.5" opacity="0.8"/>
  <polygon points="418,201 433,207 418,213" fill="#0891b2" opacity="0.8"/>

  <!-- Right panel: ΣΔ ADC + results -->
  <rect x="440" y="75" width="320" height="265" rx="8" fill="#0a1e28" stroke="#22d3ee" stroke-width="1.2" opacity="0.9"/>
  <text x="600" y="98" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#67e8f9" text-anchor="middle">Time-Domain ΣΔ ADC</text>

  <!-- ΣΔ modulator waveform -->
  <polyline points="460,160 475,130 490,185 505,125 520,175 535,135 550,170 565,128 580,165 595,132 610,168 625,130 640,162 655,128 670,158 685,133 700,155 715,130 730,155 745,132" fill="none" stroke="#22d3ee" stroke-width="2" opacity="0.9"/>
  <text x="600" y="200" font-family="monospace" font-size="9" fill="#67e8f9" text-anchor="middle" opacity="0.8">1-bit bitstream → digital accumulation</text>

  <!-- Precision comparison -->
  <rect x="460" y="215" width="300" height="28" rx="4" fill="#0e3d4a" opacity="0.9" stroke="#0891b2" stroke-width="0.8"/>
  <text x="610" y="228" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#67e8f9" text-anchor="middle">Multicolumn Residue Accumulation</text>
  <text x="610" y="240" font-family="system-ui,sans-serif" font-size="9" fill="#a5f3fc" text-anchor="middle" opacity="0.8">Boosts effective ADC resolution without area cost</text>

  <!-- Key metrics -->
  <rect x="460" y="253" width="140" height="55" rx="5" fill="#0e3d4a" opacity="0.9"/>
  <text x="530" y="275" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#a5f3fc" text-anchor="middle">High Precision</text>
  <text x="530" y="291" font-family="system-ui,sans-serif" font-size="10" fill="#67e8f9" text-anchor="middle">Analog CiM</text>
  <text x="530" y="303" font-family="system-ui,sans-serif" font-size="9" fill="#22d3ee" text-anchor="middle" opacity="0.8">ΣΔ oversampling</text>

  <rect x="615" y="253" width="145" height="55" rx="5" fill="#0e3d4a" opacity="0.9"/>
  <text x="687" y="275" font-family="system-ui,sans-serif" font-size="11" font-weight="700" fill="#a5f3fc" text-anchor="middle">Energy Efficient</text>
  <text x="687" y="291" font-family="system-ui,sans-serif" font-size="10" fill="#67e8f9" text-anchor="middle">IEEE TVLSI</text>
  <text x="687" y="303" font-family="system-ui,sans-serif" font-size="9" fill="#22d3ee" text-anchor="middle" opacity="0.8">2026</text>

  <!-- Title -->
  <text x="400" y="383" font-family="system-ui,-apple-system,sans-serif" font-size="42" font-weight="800" fill="white" text-anchor="middle" opacity="0.95">MCRA</text>
  <text x="400" y="413" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#67e8f9" text-anchor="middle">Multicolumn Residue Accumulation CiM · Time-Domain ΣΔ ADC</text>
  <text x="400" y="435" font-family="system-ui,-apple-system,sans-serif" font-size="13" fill="#0891b2" text-anchor="middle" letter-spacing="2">IEEE TVLSI 2026</text>
</svg>
