<svg width="800" height="450" viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0e00"/>
      <stop offset="100%" stop-color="#3d2200"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg)"/>
  <ellipse cx="400" cy="225" rx="340" ry="220" fill="url(#glow)"/>
  <!-- Basketball court outline (top-down) -->
  <rect x="100" y="95" width="600" height="310" rx="6" fill="none" stroke="#d97706" stroke-width="2.5" opacity="0.7"/>
  <!-- Center circle -->
  <circle cx="400" cy="250" r="55" fill="none" stroke="#d97706" stroke-width="1.8" opacity="0.55"/>
  <line x1="400" y1="95" x2="400" y2="405" stroke="#d97706" stroke-width="1.5" opacity="0.45"/>
  <!-- Left key -->
  <rect x="100" y="180" width="130" height="140" rx="2" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.5"/>
  <path d="M 230 180 A 70 70 0 0 1 230 320" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.4"/>
  <!-- Right key -->
  <rect x="570" y="180" width="130" height="140" rx="2" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.5"/>
  <path d="M 570 180 A 70 70 0 0 0 570 320" fill="none" stroke="#d97706" stroke-width="1.5" opacity="0.4"/>
  <!-- 3-point arc left -->
  <path d="M 100 155 A 200 200 0 0 1 100 345" fill="none" stroke="#d97706" stroke-width="1.3" opacity="0.35" stroke-dasharray="6 5"/>
  <!-- 3-point arc right -->
  <path d="M 700 155 A 200 200 0 0 0 700 345" fill="none" stroke="#d97706" stroke-width="1.3" opacity="0.35" stroke-dasharray="6 5"/>
  <!-- LiDAR point cloud - players -->
  <!-- Player 1 cluster (near left key) -->
  <circle cx="180" cy="235" r="5" fill="#fbbf24" opacity="0.9"/>
  <circle cx="188" cy="228" r="3.5" fill="#fde68a" opacity="0.7"/>
  <circle cx="175" cy="242" r="3" fill="#fbbf24" opacity="0.75"/>
  <!-- Player 2 cluster -->
  <circle cx="300" cy="210" r="5" fill="#fbbf24" opacity="0.9"/>
  <circle cx="310" cy="205" r="3.5" fill="#fde68a" opacity="0.7"/>
  <circle cx="295" cy="218" r="3" fill="#fbbf24" opacity="0.75"/>
  <!-- Player 3 cluster (center) -->
  <circle cx="400" cy="248" r="5.5" fill="#f59e0b" opacity="0.95"/>
  <circle cx="412" cy="240" r="4" fill="#fbbf24" opacity="0.8"/>
  <circle cx="392" cy="258" r="3.5" fill="#fde68a" opacity="0.7"/>
  <!-- Player 4 cluster -->
  <circle cx="500" cy="270" r="5" fill="#fbbf24" opacity="0.9"/>
  <circle cx="512" cy="262" r="3.5" fill="#fde68a" opacity="0.7"/>
  <circle cx="494" cy="280" r="3" fill="#fbbf24" opacity="0.75"/>
  <!-- Player 5 cluster -->
  <circle cx="620" cy="240" r="5" fill="#fbbf24" opacity="0.9"/>
  <circle cx="630" cy="235" r="3.5" fill="#fde68a" opacity="0.7"/>
  <circle cx="613" cy="248" r="3" fill="#fbbf24" opacity="0.75"/>
  <!-- Ball -->
  <circle cx="355" cy="195" r="7" fill="#fb923c" opacity="0.9"/>
  <circle cx="355" cy="195" r="7" fill="none" stroke="#fdba74" stroke-width="1.2" opacity="0.6"/>
  <!-- LiDAR sensor (ceiling mount) -->
  <circle cx="400" cy="55" r="10" fill="#f59e0b" opacity="0.8"/>
  <line x1="400" y1="65" x2="180" y2="235" stroke="#f59e0b" stroke-width="0.8" opacity="0.25"/>
  <line x1="400" y1="65" x2="300" y2="210" stroke="#f59e0b" stroke-width="0.8" opacity="0.25"/>
  <line x1="400" y1="65" x2="400" y2="248" stroke="#f59e0b" stroke-width="0.8" opacity="0.25"/>
  <line x1="400" y1="65" x2="500" y2="270" stroke="#f59e0b" stroke-width="0.8" opacity="0.25"/>
  <line x1="400" y1="65" x2="620" y2="240" stroke="#f59e0b" stroke-width="0.8" opacity="0.25"/>
  <text x="400" y="50" font-family="system-ui,sans-serif" font-size="10" font-weight="700" fill="#fde68a" text-anchor="middle" opacity="0.8">LiDAR</text>
  <!-- Title -->
  <text x="700" y="380" font-family="system-ui,-apple-system,sans-serif" font-size="40" font-weight="800" fill="white" text-anchor="end" opacity="0.95">Basket LiDAR</text>
  <text x="700" y="410" font-family="system-ui,-apple-system,sans-serif" font-size="15" fill="#fbbf24" text-anchor="end" letter-spacing="2">MMSports 2025</text>
</svg>
